name: Patch Skill Mobility evidence handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-skill-mobility.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Skill Mobility evidence handoff patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist Skill Mobility evidence into shared BOOST state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          a1 = "const BUILD_VERSION='0.9.2';\n"
          b1 = "const BUILD_VERSION='0.9.2';\nconst BOOST_STATE_KEY='pinal_boost_career_exploration_v1';\n"
          if "const BOOST_STATE_KEY='pinal_boost_career_exploration_v1';" not in s:
              assert a1 in s, 'BUILD_VERSION anchor not found'
              s = s.replace(a1, b1, 1)

          a2 = "function evidenceAvg(s){const e=skillEvidence[s];return e.count?e.sum/e.count:0}\nfunction buildResults(){"
          b2 = """function evidenceAvg(s){const e=skillEvidence[s];return e.count?e.sum/e.count:0}
function saveBoostSkillMobility(tops,carry,nurture,explore,less){
  let shared={};
  try{shared=JSON.parse(localStorage.getItem(BOOST_STATE_KEY)||'null')||{}}catch(_){shared={}}
  const detail=(skill)=>({skill,evidenceLabel:capFor(skill),evidenceAverage:Number(evidenceAvg(skill).toFixed(2)),preferenceAverage:Number(prefFor(skill).toFixed(2)),lookFor:LOOKFOR[skill]||''});
  const now=new Date().toISOString();
  const result={version:'pizza-lab-v1',source:'BOOST Skill Mobility — Finding Yourself in Work',completedAt:now,topInterests:[...tops],strengthsToCarryForward:carry.map(detail),wantMore:nurture.map(detail),stillExploring:explore.map(detail),doNotPrioritize:less.map(detail)};
  shared.updatedAt=now;
  shared.skillMobility=result;
  localStorage.setItem(BOOST_STATE_KEY,JSON.stringify(shared));
  window.BOOST_SKILL_MOBILITY=result;
}
function buildResults(){"""
          if 'function saveBoostSkillMobility(' not in s:
              assert a2 in s, 'evidenceAvg/buildResults anchor not found'
              s = s.replace(a2, b2, 1)

          a3 = "  const less=ranked.filter(s=>prefFor(s)<.6).slice(0,4);\n  const fam="
          b3 = "  const less=ranked.filter(s=>prefFor(s)<.6).slice(0,4);\n  saveBoostSkillMobility(tops,carry,nurture,explore,less);\n  const fam="
          if 'saveBoostSkillMobility(tops,carry,nurture,explore,less);' not in s:
              assert a3 in s, 'results array anchor not found'
              s = s.replace(a3, b3, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-skill-mobility.yml
          git config user.name "BOOST Update Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Skill Mobility evidence into shared BOOST state [skip ci]"
          git push origin main
