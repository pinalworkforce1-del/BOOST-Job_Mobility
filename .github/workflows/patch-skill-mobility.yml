name: Patch Skill Mobility evidence handoff

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-skill-mobility.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared BOOST evidence handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if "const BOOST_STATE_KEY='pinal_boost_career_exploration_v1';" not in s:
              s=s.replace("const BUILD_VERSION='0.9.2';", "const BUILD_VERSION='0.9.2';\nconst BOOST_STATE_KEY='pinal_boost_career_exploration_v1';", 1)
          if 'function saveBoostSkillMobility(' not in s:
              anchor="function evidenceAvg(s){const e=skillEvidence[s];return e.count?e.sum/e.count:0}\nfunction buildResults(){"
              insert="""function evidenceAvg(s){const e=skillEvidence[s];return e.count?e.sum/e.count:0}
function saveBoostSkillMobility(tops,carry,nurture,explore,less){
  let shared={};
  try{shared=JSON.parse(localStorage.getItem(BOOST_STATE_KEY)||'null')||{}}catch(_){shared={}}
  const detail=(skill)=>({skill,evidenceLabel:capFor(skill),evidenceAverage:Number(evidenceAvg(skill).toFixed(2)),preferenceAverage:Number(prefFor(skill).toFixed(2)),lookFor:LOOKFOR[skill]||''});
  const now=new Date().toISOString();
  const result={version:'pizza-lab-v1',source:'BOOST Skill Mobility — Finding Yourself in Work',completedAt:now,topInterests:[...tops],strengthsToCarryForward:carry.map(detail),wantMore:nurture.map(detail),stillExploring:explore.map(detail),doNotPrioritize:less.map(detail)};
  shared.updatedAt=now;shared.skillMobility=result;
  localStorage.setItem(BOOST_STATE_KEY,JSON.stringify(shared));
  window.BOOST_SKILL_MOBILITY=result;
}
function buildResults(){"""
              assert anchor in s
              s=s.replace(anchor,insert,1)
          call="saveBoostSkillMobility(tops,carry,nurture,explore,less);"
          if call not in s:
              anchor="  const less=ranked.filter(s=>prefFor(s)<.6).slice(0,4);\n"
              assert anchor in s
              s=s.replace(anchor,anchor+'  '+call+'\n',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire Skill Mobility evidence into shared BOOST state [skip ci]"
          git push
