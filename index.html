<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST Skill Mobility — Finding Yourself in Work</title><style>html,body{margin:0;height:100%;background:#091521}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="core" title="BOOST Skill Mobility"></iframe><script>
const KEY='pinal_boost_career_exploration_v1';
const frame=document.getElementById('core');
frame.src='skill-mobility-core.html'+location.search;
function txt(el){return (el?.textContent||'').trim()}
function itemNamesBetween(root,startTitle,endTitle){const heads=[...root.querySelectorAll('h3.resultsHeadline')];const start=heads.find(h=>txt(h)===startTitle);if(!start)return[];let out=[];let n=start.nextElementSibling;while(n){if(n.matches?.('h3.resultsHeadline')&&(endTitle==null||txt(n)===endTitle))break;if(n.matches?.('h3.resultsHeadline'))break;n.querySelectorAll?.('.resultBlock h3,.evidenceBlock h3').forEach(x=>out.push(txt(x)));n=n.nextElementSibling}return [...new Set(out.filter(Boolean))]}
function capture(){let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(_){return}if(!d||!w)return;const stage=d.getElementById('resultsStage');if(!stage?.classList.contains('active'))return;const root=d.getElementById('results');if(!root)return;const strengths=itemNamesBetween(root,'Strengths to Carry Forward','Ways of Working You Want More Of');const want=itemNamesBetween(root,'Ways of Working You Want More Of','Areas You’re Still Exploring');const exploring=itemNamesBetween(root,'Areas You’re Still Exploring','Useful Skills You Don’t Want to Prioritize');const less=itemNamesBetween(root,'Useful Skills You Don’t Want to Prioritize','What to Look for in Your Next Opportunity');if(!strengths.length&&!want.length&&!exploring.length&&!less.length)return;let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(_){state={}}const now=new Date().toISOString();state.updatedAt=now;state.skillMobility={version:'pizza-lab-v1',source:'BOOST Skill Mobility — Finding Yourself in Work',completedAt:now,strengthsToCarryForward:strengths.map(skill=>({skill})),wantMore:want.map(skill=>({skill})),stillExploring:exploring.map(skill=>({skill})),doNotPrioritize:less.map(skill=>({skill}))};localStorage.setItem(KEY,JSON.stringify(state));window.BOOST_SKILL_MOBILITY=state.skillMobility}
frame.addEventListener('load',()=>{capture();try{const d=frame.contentDocument;new MutationObserver(capture).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})}catch(_){} });
setInterval(()=>{capture();try{const u=new URL(frame.contentWindow.location.href);if(u.origin===location.origin&&!u.pathname.endsWith('/skill-mobility-core.html')&&u.pathname!==location.pathname)location.assign(u.href)}catch(_){}},700);
</script></body></html>
